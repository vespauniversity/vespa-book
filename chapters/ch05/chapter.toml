[chapter]
number = 5
title = "Hybrid Search"
corpus_preset = "book"

[bootstrap]
# What ./bootstrap.sh runs when the index holds fewer documents than this, or
# when none of them carries the vector field yet. Chapter 4's end state
# already has all 101,341 documents with `title_embedding` populated, and this
# chapter adds rank profiles and a document summary, not a field: continuing
# from chapter 4 is a deploy and no feed. A fresh container feeds once, with
# the in-app embedder, exactly as chapter 4 did.
feed = ".venv/bin/python shared/tools/feed.py --out chapters/ch05/expected/feed.json"
documents = 101341
requires_field = "title_embedding"

[requirements]
# alpha_sweep.py and context.py embed queries through the container, but the
# evaluate path they share with chapter 4 imports the embed group's modules.
groups = ["base", "embed"]

[tools]
# The shared tools this chapter ships. A publish copies the union of these
# lists, so a name missing from every chapter's is a script a reader is told to
# run and does not have.
#
# A list, not something worked out at publish time: a closure computed there is
# wrong quietly. This list was itself seeded from such a closure and came out
# one name short, because the closure matched `import x` and not `from x import
# y` - which is how five of these are imported.
shared = [
  "builds.py",
  "compare.py",
  "corpus.py",
  "deployed.py",
  "evaluate.py",
  "feed.py",
  "gains.py",
  "hf.py",
  "hostinfo.py",
  "metrics.py",
  "query.py",
]
